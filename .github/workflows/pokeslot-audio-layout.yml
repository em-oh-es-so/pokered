name: Pokeslot Cabinet Audio Memory Check
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/**'
      - 'audio/**'
      - 'constants/**'
      - 'macros/**'
      - 'ram/wram.asm'
      - 'data/pokemon/cries.asm'
      - '.rgbds-version'
      - '.github/workflows/pokeslot-audio-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and Python syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config python3-venv
          python3 -m venv .layout-venv
          .layout-venv/bin/pip install pillow
          python3 -m py_compile pokeslot/audio_cabinet_layout.py pokeslot/cabinet_ldh_compat.py
      - name: Build repository-pinned RGBDS
        run: |
          RGBDS_VERSION="$(tr -d '[:space:]' < .rgbds-version)"
          [[ "$RGBDS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --depth 1 --branch "v$RGBDS_VERSION" https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Build syntax-normalized cabinet baseline and audio sources
        run: |
          export PATH="$GITHUB_WORKSPACE/.layout-venv/bin:$PATH"
          make -C pokeslot -f play.mk build/play/main.asm
          python3 pokeslot/cabinet_ldh_compat.py
          make -C pokeslot -f play.mk
          make -C pokeslot -f native_audio.mk
      - name: Link audio-disabled memory reservation build
        working-directory: pokeslot
        run: |
          python3 audio_cabinet_layout.py
          rgbasm -Wall -I ../ -o build/audio/cabinet-audio-layout.o build/audio/cabinet-audio-layout.asm
          rgblink -n build/audio/cabinet-audio-layout.sym -m build/audio/cabinet-audio-layout.map -o build/audio/cabinet-audio-layout.gbc build/audio/cabinet-audio-layout.o
          rgbfix -v -C -p 0 -m 0x1a -r 0x02 -t POKESLOTPLAY build/audio/cabinet-audio-layout.gbc
          python3 audio_cabinet_layout.py --report
      - name: Preserve memory report and linker diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokeslot-cabinet-audio-memory-check-not-a-play-build
          path: |
            pokeslot/build/audio/cabinet-audio-layout-report.json
            pokeslot/build/audio/cabinet-audio-layout.sym
            pokeslot/build/audio/cabinet-audio-layout.map
            pokeslot/build/audio/cabinet-audio-layout.asm
            pokeslot/build/audio/cabinet-audio-layout.inc
            pokeslot/build/play/cabinet-ldh-compat-report.json
            pokeslot/build/play/play.sym
            pokeslot/build/play/play.map
          if-no-files-found: warn
