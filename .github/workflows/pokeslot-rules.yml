name: Pokeslot Rules Tests
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/rules/**'
      - '.github/workflows/pokeslot-rules.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test matching and accounting
        run: python3 -m unittest discover -s pokeslot/rules -p 'test_*.py' -v
      - name: Exhaustive payout audit
        run: python3 pokeslot/rules/engine.py
      - uses: actions/upload-artifact@v4
        with:
          name: pokeslot-math-report
          path: pokeslot/build/math/math-report.json
          if-no-files-found: error
