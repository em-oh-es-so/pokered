name: Pokeslot Audio RAM Fit Check
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/audio_ram_probe.py'
      - 'pokeslot/native_audio_build.py'
      - 'pokeslot/audio_compat.py'
      - 'pokeslot/audio_worker_build.py'
      - 'pokeslot/native_audio.mk'
      - 'pokeslot/rules/machine.json'
      - 'audio/**'
      - 'constants/**'
      - 'macros/**'
      - 'ram/wram.asm'
      - 'data/pokemon/cries.asm'
      - '.rgbds-version'
      - '.github/workflows/pokeslot-audio-ram-probe.yml'
permissions:
  contents: read
jobs:
  ram-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and Python syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config
          python3 -m py_compile pokeslot/audio_ram_probe.py
      - name: Build repository-pinned RGBDS
        run: |
          RGBDS_VERSION="$(tr -d '[:space:]' < .rgbds-version)"
          [[ "$RGBDS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --depth 1 --branch "v$RGBDS_VERSION" https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Build standalone source and static RAM probe
        working-directory: pokeslot
        run: |
          make -f native_audio.mk
          python3 audio_ram_probe.py
          rgbasm -Wall -I ../ -o build/audio/ram-probe.o build/audio/ram-probe.asm
          rgblink -n build/audio/ram-probe.sym -m build/audio/ram-probe.map -o build/audio/ram-probe-not-playable.gbc build/audio/ram-probe.o
          python3 audio_ram_probe.py --report
      - name: Preserve report and diagnostics, not a game ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokeslot-audio-ram-fit-not-a-game-build
          path: |
            pokeslot/build/audio/audio-ram-probe-report.json
            pokeslot/build/audio/ram-probe.sym
            pokeslot/build/audio/ram-probe.map
            pokeslot/build/audio/ram-probe.asm
            pokeslot/build/audio/ram-probe.inc
          if-no-files-found: warn
