name: Pokeslot Cabinet Streaming Test
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/streaming.mk'
      - 'pokeslot/stream_assets.py'
      - 'pokeslot/src/cabinet_test.asm'
      - 'pokeslot/preview_classic.py'
      - 'pokeslot/preview_layout.py'
      - 'gfx/font/**'
      - 'gfx/slots/**'
      - 'gfx/pokemon/front/**'
      - '.github/workflows/pokeslot-streaming.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libpng-dev pkg-config zip python3-pil
      - name: Build RGBDS
        run: |
          git clone --depth 1 --branch v0.9.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Build isolated streaming test
        run: make -C pokeslot -f streaming.mk
      - name: Package diagnostic
        run: |
          cd pokeslot/build/stream
          zip cabinet-test.zip cabinet-test.gbc cabinet-test.map cabinet-test.sym streaming-report.json expected-cabinet-8x.png README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokeslot-cabinet-test
          path: pokeslot/build/stream/cabinet-test.zip
          if-no-files-found: error
