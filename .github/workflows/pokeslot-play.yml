name: Pokeslot Playable Cabinet
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/play.mk'
      - 'pokeslot/play_build.py'
      - 'pokeslot/speed_build.py'
      - 'pokeslot/win_build.py'
      - 'pokeslot/test_speed_rom.py'
      - 'pokeslot/test_wins_rom.py'
      - 'pokeslot/src/**'
      - 'pokeslot/five_assets.py'
      - 'pokeslot/accounting_tables.py'
      - 'pokeslot/preview_classic.py'
      - 'pokeslot/preview_layout.py'
      - 'pokeslot/test_play_rom.py'
      - 'pokeslot/rules/**'
      - '.github/workflows/pokeslot-play.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config python3-venv libsdl2-2.0-0 zip
          python3 -m venv .play-venv
          .play-venv/bin/pip install pillow 'pyboy>=2,<3'
      - name: RGBDS
        run: |
          git clone --depth 1 --branch v0.9.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Reference tests
        run: python3 -m unittest discover -s pokeslot/rules -p 'test_*.py' -v
      - name: Build playable cabinet and separate highlight test ROM
        run: PATH="$GITHUB_WORKSPACE/.play-venv/bin:$PATH" make -C pokeslot -f play.mk all highlight-test
      - name: Integration and paytable graphics tests
        run: .play-venv/bin/python pokeslot/build/play/test_play_with_wins.py
      - name: Preserve accepted reel timing
        run: .play-venv/bin/python pokeslot/test_speed_rom.py
      - name: Check winning lines and exact negative pixel masks
        run: .play-venv/bin/python pokeslot/test_wins_rom.py
      - name: Package playable ROM ZIP
        run: |
          cd pokeslot/build/play
          test -s pokeslot-play.gbc
          test -s integration-report.json
          test -s speed-report.json
          test -s win-report.json
          printf 'Commit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-info.txt
          zip pokeslot-play.zip pokeslot-play.gbc play.map play.sym README.txt integration-report.json five-report.json ui-layout.json speed-model-report.json speed-report.json win-layout.json win-report.json build-info.txt
          unzip -t pokeslot-play.zip
      - name: Upload playable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pokeslot-playable-cabinet
          path: pokeslot/build/play/pokeslot-play.zip
          if-no-files-found: error
