name: Pokeslot ROM
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/**'
      - 'gfx/pokemon/front/**'
      - '.github/workflows/pokeslot.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libpng-dev pkg-config zip python3-pil
      - name: Generate symbol comparison
        run: python3 pokeslot/preview_symbols.py
      - name: Upload artwork review
        uses: actions/upload-artifact@v4
        with:
          name: pokeslot-art-review
          path: pokeslot/build/art-review/
          if-no-files-found: error
      - name: Build pinned RGBDS
        run: |
          git clone --depth 1 --branch v0.9.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Build standalone ROM
        run: make -C pokeslot
      - name: Package ROM and debug files
        run: |
          cd pokeslot/build
          zip pokeslot.zip pokeslot.gb pokeslot.map pokeslot.sym
      - uses: actions/upload-artifact@v4
        with:
          name: pokeslot-rom
          path: pokeslot/build/pokeslot.zip
          if-no-files-found: error
