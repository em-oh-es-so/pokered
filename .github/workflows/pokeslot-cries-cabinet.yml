name: Pokeslot Qualifying Win Cries Candidate
on:
  workflow_dispatch:
  push:
    branches: [pokeslot]
    paths:
      - 'pokeslot/**'
      - 'audio/**'
      - 'constants/**'
      - 'macros/**'
      - 'ram/wram.asm'
      - 'data/pokemon/cries.asm'
      - '.rgbds-version'
      - '.github/workflows/pokeslot-cries-cabinet.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config python3-venv libsdl2-2.0-0 zip
          python3 -m venv .music-venv
          .music-venv/bin/pip install pillow 'pyboy>=2,<3'
          python3 -m py_compile pokeslot/cry_cabinet_build.py pokeslot/test_cabinet_cries.py pokeslot/cry_mix_build.py pokeslot/test_cry_mix.py
      - name: Build pinned RGBDS
        run: |
          VERSION="$(tr -d '[:space:]' < .rgbds-version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --depth 1 --branch "v$VERSION" https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Audit policy and generate separate cry candidate
        run: |
          export PATH="$GITHUB_WORKSPACE/.music-venv/bin:$PATH"
          python3 pokeslot/test_cry_policy.py
          make -C pokeslot -f play.mk build/play/main.asm
          python3 pokeslot/cabinet_ldh_compat.py
          make -C pokeslot -f play.mk
          make -C pokeslot -f native_audio.mk
          python3 pokeslot/music_cabinet_build.py
          python3 pokeslot/effects_cabinet_build.py
          python3 pokeslot/cry_cabinet_build.py
          python3 pokeslot/cry_mix_build.py
      - name: Assemble candidate and fixture ROM
        working-directory: pokeslot
        run: |
          rgbasm -Wall -I ../ -o build/music-cabinet/main.o build/music-cabinet/main.asm
          rgblink -n build/music-cabinet/play.sym -m build/music-cabinet/play.map -o build/music-cabinet/pokeslot-play.gbc build/music-cabinet/main.o
          rgbfix -v -C -p 0 -m 0x1a -r 0x02 -t POKESLOTPLAY build/music-cabinet/pokeslot-play.gbc
          rgbasm -Wall -I ../ -D WIN_TESTS=1 -o build/music-cabinet/highlights-test.o build/music-cabinet/main.asm
          rgblink -n build/music-cabinet/highlights-test.sym -o build/music-cabinet/highlights-test.gbc build/music-cabinet/highlights-test.o
          rgbfix -v -C -p 0 -m 0x1a -r 0x02 -t WINTEST build/music-cabinet/highlights-test.gbc
      - name: Check six cries, preview, mix ducking and volume restoration
        run: .music-venv/bin/python pokeslot/test_cry_mix.py
      - name: Play and accounting regression with cries enabled
        run: .music-venv/bin/python pokeslot/run_music_regression.py play
      - name: Existing speed gate with cries enabled
        run: .music-venv/bin/python pokeslot/run_music_regression.py speed
      - name: Exhaustive wins and highlight pixel-mask regression
        run: .music-venv/bin/python pokeslot/run_music_regression.py wins
      - name: Package separate experimental cry cabinet
        run: |
          mkdir -p pokeslot/build/music-cabinet/delivery
          cd pokeslot/build/music-cabinet
          cp pokeslot-play.gbc README.txt cry-candidate-layout.json cry-mix-layout.json cry-mix-report.json integration-report.json speed-report.json win-report.json music-*-report.json cry-cabinet-*.wav delivery/
          printf 'Commit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > delivery/build-info.txt
          cd delivery
          zip ../pokeslot-cries-cabinet.zip *.gbc *.json *.txt *.wav
          unzip -t ../pokeslot-cries-cabinet.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pokeslot-qualifying-cries-cabinet-candidate
          path: pokeslot/build/music-cabinet/pokeslot-cries-cabinet.zip
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokeslot-cries-cabinet-diagnostics
          path: |
            pokeslot/build/music-cabinet/*report.json
            pokeslot/build/music-cabinet/*failure.json
            pokeslot/build/music-cabinet/cry-mix-layout.json
            pokeslot/build/music-cabinet/play.sym
            pokeslot/build/music-cabinet/play.map
            pokeslot/build/music-cabinet/main.asm
            pokeslot/build/music-cabinet/cry-cabinet-*.wav
          if-no-files-found: warn
